name: demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assertions:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print the four formula result sets
        run: python scripts/run_demo.py

      - name: Assert the expected figures
        run: python scripts/run_demo.py --check
